[project]
name = "miniagentos-coder-backend"
version = "0.1.0"
description = "Local coding-agent runtime daemon for MiniAgentOS Coder"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
]

[project.scripts]
miniagent = "app.cli:main"
miniagent-benchmark = "app.evaluation.benchmark:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.0",
]
desktop = [
  "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
